<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fragments · Pièce introuvable</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b211a">
<meta name="color-scheme" content="dark">
<meta http-equiv="refresh" content="8; url=/">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preload" href="/fonts/big-shoulders-stencil-display-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Servie par GitHub Pages pour toute adresse inconnue : chemins absolus obligatoires. */
  @font-face { font-family: 'Stencil'; src: url('/fonts/big-shoulders-stencil-display-latin-900-normal.woff2') format('woff2'); font-weight: 900; font-display: swap; }
  @font-face { font-family: 'Typewriter'; src: url('/fonts/courier-prime-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  :root { --desk: #1b211a; --chalk: #e4e6d6; --chalk-dim: #a7ad97; --glow: #ffb24a; --paper: #e8dec6; --ink: #26211a; --red: #b8322a; color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; text-align: center; color: var(--chalk); font: 16px/1.55 'Typewriter', 'Courier New', monospace;
    background: radial-gradient(120% 70% at 50% -10%, rgba(255, 220, 160, .12), transparent 60%), var(--desk); }
  main { padding: 24px 16px; max-width: 420px; }
  .fiche { position: relative; background: var(--paper); color: var(--ink); padding: 34px 22px 24px; transform: rotate(-1deg); box-shadow: 0 22px 30px -18px #000; }
  .tampon { display: inline-block; transform: rotate(-7deg); border: 3px double var(--red); color: var(--red); padding: 2px 10px; margin: 0 0 14px;
    font: 900 30px/1.05 'Stencil', 'Impact', sans-serif; letter-spacing: .04em; }
  h1 { font: 900 18px/1.3 'Typewriter', 'Courier New', monospace; margin: 0 0 6px; }
  p { margin: 0 0 6px; }
  a.btn { display: inline-block; margin-top: 26px; padding: 14px 26px; border-radius: 12px; background: var(--glow); color: #241a08;
    font: 900 22px/1 'Stencil', 'Impact', sans-serif; letter-spacing: .04em; text-decoration: none; }
  a.btn:focus-visible { outline: 2px solid var(--chalk); outline-offset: 3px; }
  .auto { margin-top: 16px; color: var(--chalk-dim); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="fiche">
    <span class="tampon" aria-hidden="true">INTROUVABLE</span>
    <h1>Cette pièce n'est pas au dossier.</h1>
    <p>La page demandée n'existe pas.</p>
  </div>
  <a class="btn" href="/">Retour à l'accueil</a>
  <p class="auto">Retour automatique dans quelques secondes.</p>
</main>
</body>
</html>
